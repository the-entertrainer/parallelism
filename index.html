<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Parallelism — Interactive training for instructional designers and content developers on parallel structure." />
  <meta name="theme-color" content="#0a0a12" />
  <title>Parallelism · Training for Instructional Designers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="app" role="application" aria-label="Parallelism interactive presentation">
    <!-- 3D Background Canvas -->
    <canvas id="bg-canvas" aria-hidden="true"></canvas>

    <!-- Ambient glow orbs -->
    <div class="ambient-orbs" aria-hidden="true">
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
      <div class="orb orb-3"></div>
    </div>

    <!-- Progress rail -->
    <nav class="progress-rail" aria-label="Slide progress">
      <div class="progress-fill" id="progress-fill"></div>
      <div class="progress-dots" id="progress-dots"></div>
    </nav>

    <!-- Main slide stage -->
    <main id="stage" class="stage" aria-live="polite">
      <!-- Slides injected by JS -->
    </main>

    <!-- Controls -->
    <div class="controls" role="group" aria-label="Presentation controls">
      <button id="btn-prev" class="ctrl-btn" aria-label="Previous slide" disabled>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <button id="btn-next" class="ctrl-btn primary" aria-label="Next slide">
        <span class="btn-label">Start</span>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </div>

    <!-- Keyboard hint -->
    <div class="key-hint" id="key-hint" aria-hidden="true">
      <kbd>←</kbd> <kbd>→</kbd> or swipe to navigate
    </div>

    <!-- Reduced motion notice -->
    <div class="motion-notice" id="motion-notice" hidden>
      Animations reduced for accessibility. Toggle in system settings.
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
